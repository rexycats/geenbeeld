<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Servicedesk Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: helpdesk-applicatie — vaste HUD bovenaan, daaronder planning (weekkaarten) of een dienst in een drie-kolommen servicedesk */
:root{
  --bg:#e9edf2; --surface:#ffffff; --sunk:#f3f6f9; --ink:#16202b; --muted:#566475; --line:#d2dae2;
  --accent:#1d5cc0; --accent-soft:#e1ebfa; --warn:#b86a0e; --warn-soft:#fbefdf; --ok:#2a7d52; --ok-soft:#e0f2e8; --bad:#c0392b;
  --navy:#14263f; --navy-ink:#e7eef8;
  --note:#fff6d6; --note-ink:#4a3d12; --note-line:#d8b64a; --agent-bg:#1d5cc0; --agent-ink:#ffffff;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#16202a; --sunk:#111922; --ink:#e2e8ee; --muted:#93a2b2; --line:#283543;
  --accent:#72a6f2; --accent-soft:#1a2c46; --warn:#e6a24e; --warn-soft:#33260f; --ok:#5fc08d; --ok-soft:#14301f; --bad:#ef7a6c;
  --navy:#0b1626; --navy-ink:#dbe6f4; --note:#3a3214; --note-ink:#f2e2a8; --note-line:#8a7430; --agent-bg:#2a5596; --agent-ink:#f2f6fb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#16202a; --sunk:#111922; --ink:#e2e8ee; --muted:#93a2b2; --line:#283543;
  --accent:#72a6f2; --accent-soft:#1a2c46; --warn:#e6a24e; --warn-soft:#33260f; --ok:#5fc08d; --ok-soft:#14301f; --bad:#ef7a6c;
  --navy:#0b1626; --navy-ink:#dbe6f4; --note:#3a3214; --note-ink:#f2e2a8; --note-line:#8a7430; --agent-bg:#2a5596; --agent-ink:#f2f6fb; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;display:grid;gap:28px}
#app{display:grid;gap:36px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 16px;font-weight:600;font-size:.94rem}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 10px;font-size:.82rem;background:transparent;color:var(--navy-ink);border-color:rgba(255,255,255,.25)}
.btn.wide{width:100%}
.wiz-actions{display:flex;flex-wrap:wrap;gap:10px}
.pill{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.stars{color:var(--warn);letter-spacing:.06em}
.stars .off{color:var(--line)}
.stars.sm{font-size:1rem}.stars.big{font-size:2.3rem;line-height:1}
.cat{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.c-hw{background:#e6e9f7;color:#3b4aa0}.c-cab{background:#e3f1f4;color:#1f6b7a}.c-set{background:#f4ecdc;color:#8a5a12}
.c-gpu{background:#f6e3e3;color:#9a3030}.c-drv{background:#e6f2e6;color:#2d6b31}.c-sw{background:#efe6f5;color:#6b3d8a}
:root[data-theme="dark"] .cat{filter:saturate(.8) brightness(.75) contrast(1.2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat{filter:saturate(.8) brightness(.75) contrast(1.2)}}

/* HUD */
.hudbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  background:var(--navy);color:var(--navy-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.hud-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;background:none;border:0;padding:0;color:inherit}
.sd-mark{display:grid;place-items:center;width:26px;height:26px;border-radius:6px;background:#3b82f6;color:#fff;font-size:.72rem;font-weight:800}
#hud{display:flex;align-items:center;gap:16px;margin-left:auto;flex-wrap:wrap;min-width:0}
.hud-l{display:grid;line-height:1.15}.hud-l small{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.hud-x{display:grid;gap:3px;min-width:180px}.hud-x .track{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.hud-x .track i{display:block;height:100%;background:#f0a640;transition:width .5s}.hud-x span:last-child{font-family:var(--f-mono);font-size:.7rem;opacity:.8}
.hud-b{font-family:var(--f-mono);font-size:.8rem;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 10px}

/* Planning */
.hero{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end;padding-top:32px}
.hero-t{display:grid;gap:12px}.hero-t p{color:var(--muted);max-width:60ch;font-size:1.06rem}
.player{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px}
.player label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.player input{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--sunk);color:var(--ink)}
.pstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 0}
.pstats dt{font-size:.74rem;color:var(--muted)}.pstats dd{margin:0;font-family:var(--f-display);font-size:1.3rem;font-weight:700;font-variant-numeric:tabular-nums}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.unlock{font-size:.86rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.days.extra{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
.dc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dc.done{border-color:var(--ok)}.dc.locked{opacity:.6}
.dc.exam{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}.dc.exam .dc-s{color:var(--navy-ink);opacity:.8}.dc.exam .dc-day{color:#f0a640}
.dc-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dc-day{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.dc-cats{display:flex;flex-wrap:wrap;gap:4px}.dc-s{font-size:.84rem;color:var(--muted)}
.dc .btn{margin-top:auto}.dc-cats{align-items:flex-start}
.steps{margin:0;padding-left:1.3em;display:grid;gap:6px;max-width:75ch}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;justify-items:start}
.badge .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--sunk);color:var(--muted);border:2px dashed var(--line)}
.badge.got .ico{background:var(--warn);color:var(--surface);border:2px solid var(--warn)}
.badge p{font-size:.82rem;color:var(--muted);line-height:1.35}.badge:not(.got){opacity:.7}

/* Briefing */
.brief{display:grid;gap:14px;max-width:720px;padding-top:32px}
.brief-card{background:var(--note);color:var(--note-ink);border:1px dashed var(--note-line);border-radius:12px;padding:16px 18px;display:grid;gap:8px}
.brief-card ul{margin:0;padding-left:1.2em;display:grid;gap:5px}
.warnline{color:var(--warn);font-weight:600}

/* Servicedesk */
.sd{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface);margin-top:20px}
.sd-top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:#1d3557;color:var(--navy-ink);flex-wrap:wrap}
.sd-logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700}
.sd-day{font-size:.88rem;opacity:.9}
.sd-prog{display:flex;align-items:center;gap:4px}.sd-prog i{width:18px;height:5px;border-radius:3px;background:rgba(255,255,255,.2)}
.sd-prog i.d{background:#5fc08d}.sd-prog i.a{background:#f0a640}.sd-prog small{font-family:var(--f-mono);font-size:.7rem;opacity:.8;margin-left:6px}
.sd-me{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:.84rem}
.sd-dot{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px rgba(52,211,153,.25)}
.sd-body{display:grid;grid-template-columns:200px minmax(0,1fr) 300px;min-height:660px}
.sd-side{border-right:1px solid var(--line);background:var(--sunk);padding:12px 10px;display:grid;align-content:start;gap:4px}
.sd-side h4,.composer h4,.det-card h4{margin:0;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.sd-side h4{margin:4px 4px 6px}
.conv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 8px;border-radius:8px}
.conv b{display:block;font-size:.9rem;line-height:1.2}.conv small{display:block;font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.active{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent)}.conv.new{background:var(--accent-soft)}.conv.done{opacity:.75}.conv.wait{opacity:.55}
.badge-n{background:#e5484d;color:#fff;border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#c7d7ee;color:#1d3a66;font-weight:700;font-size:.72rem;flex:0 0 auto}
.av.lg{width:40px;height:40px;font-size:.88rem}
:root[data-theme="dark"] .av{background:#28406a;color:#d6e4fa}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .av{background:#28406a;color:#d6e4fa}}
.sd-main{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0}
.sd-head{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sd-head .pill{margin-left:auto}
.h-who{display:grid;line-height:1.2;min-width:0}.h-who small{color:var(--muted);font-size:.8rem}
.st-inbehandeling{background:var(--accent-soft);color:var(--accent)}.st-terplaatse{background:var(--warn-soft);color:var(--warn)}
.st-opgelost,.st-gesloten{background:var(--ok-soft);color:var(--ok)}
.onsite{border-bottom:1px solid var(--line);background:#0f151c;padding:10px 12px;display:grid;gap:8px}
.os-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;color:#d6e2ef;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase}
.runbar{height:4px;border-radius:2px;background:#283543;overflow:hidden}.runbar i{display:block;height:100%;width:0;background:#72a6f2}
#scene svg{display:block;width:100%;max-height:310px;height:auto;border-radius:6px}
.thread{overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;height:430px;scroll-behavior:smooth}
.row{display:flex;gap:8px;align-items:flex-end;max-width:85%;animation:pop .25s ease-out}
.row.user{align-self:flex-start}.row.agent{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:9px 13px;border-radius:14px;font-size:.95rem;line-height:1.45;min-width:0}
.row.user .bub{background:var(--sunk);border:1px solid var(--line);border-bottom-left-radius:4px}
.row.agent .bub{background:var(--agent-bg);color:var(--agent-ink);border-bottom-right-radius:4px}
.typing .bub{display:flex;gap:8px;align-items:center}.typing small{color:var(--muted);font-size:.78rem}
.dots{display:flex;gap:3px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.photo{width:min(340px,62vw);border-radius:8px;overflow:hidden}.photo svg{display:block;width:100%;height:auto}
.ph-cap{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);margin-top:4px}
.sysmsg{align-self:center;font-size:.78rem;color:var(--muted);background:var(--sunk);border-radius:999px;padding:3px 12px;text-align:center;animation:pop .25s ease-out}
.note-i{align-self:stretch;background:var(--note);border:1px dashed var(--note-line);border-radius:8px;padding:8px 12px;font-size:.9rem;color:var(--note-ink);animation:pop .25s ease-out}
.note-i.good{background:var(--ok-soft);border-color:var(--ok);color:var(--ink)}.note-i.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--ink)}
.ni-h{display:flex;gap:6px;align-items:center;font-size:.72rem;opacity:.9;margin-bottom:3px}
.ava{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--surface);font-family:var(--f-display);font-weight:800;font-size:.64rem;flex:0 0 auto}
.obs-c{align-self:stretch;border-left:3px solid var(--accent);background:var(--sunk);border-radius:0 8px 8px 0;padding:6px 12px;font-size:.92rem;animation:pop .25s ease-out}
.obs-c.good{border-left-color:var(--ok)}.obs-c .meta{display:block;font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}
.incoming{margin:auto;display:grid;gap:14px;justify-items:center;text-align:center;max-width:440px}
.inc-card{display:flex;gap:12px;text-align:left;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:14px;animation:ring 1.6s ease-in-out infinite}
.inc-card p{margin:4px 0;font-size:.95rem}.inc-card small{font-family:var(--f-mono);font-size:.72rem;color:var(--warn)}
.composer{border-top:1px solid var(--line);padding:10px 14px 14px;display:grid;gap:10px;background:var(--sunk)}
.composer:empty{display:none}
.ctabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.ctab{border:0;background:none;padding:6px 12px;font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ctab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.cg{display:grid;gap:5px}.cg h5{margin:0;font-size:.74rem;color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem;display:flex;gap:7px;align-items:baseline;text-align:left}
.chip:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.chip .c{font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}
.chip:disabled{opacity:.4;cursor:default}
.chip.go{border-color:var(--warn);color:var(--warn);font-weight:600}
.chip.locked::before{content:"🔒";font-size:.7rem}
.chip.ghost{background:transparent;border-style:dashed}
.chip.right{opacity:1;border-color:var(--ok);background:var(--ok-soft)}.chip.wrong{opacity:1;border-color:var(--warn);background:var(--warn-soft)}
.hintline{font-size:.8rem;color:var(--muted)}
.sd-det{border-left:1px solid var(--line);background:var(--sunk);padding:12px;display:grid;align-content:start;gap:12px;min-width:0}
.det-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.det-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0;font-size:.88rem}.kv dt{color:var(--muted)}.kv dd{margin:0}
.det-time{display:flex;justify-content:space-between;align-items:end;gap:8px;border-top:1px solid var(--line);padding-top:8px}
.det-time b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.1}
.goal{display:grid;justify-items:end}.goal small{font-family:var(--f-mono);font-size:.66rem;color:var(--muted)}
.alive{font-family:var(--f-mono);font-size:.72rem;color:var(--accent);font-variant-numeric:tabular-nums}
.hyp{display:grid;gap:5px;max-height:380px;overflow-y:auto}
.hy{display:grid;gap:3px;justify-items:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 9px;font-size:.88rem}
.hy:hover:not(:disabled){border-color:var(--accent)}
.hy.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.outlist summary{cursor:pointer;font-size:.82rem;color:var(--muted)}
.outlist{display:grid;gap:4px}.outlist .hy{opacity:.6;background:transparent;margin-top:4px}
.outlist .hy-t{text-decoration:line-through}.hy-why{font-family:var(--f-mono);font-size:.64rem;color:var(--warn)}
.endcard{align-self:stretch;display:grid;gap:12px;background:var(--surface);border:1px solid var(--ok);border-radius:10px;padding:16px;animation:pop .3s ease-out}
.end-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.stats div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.stats dt{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stats dd{margin:0;font-family:var(--f-display);font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums}
.stats small{font-size:.72rem;color:var(--muted)}
.quiz{background:var(--note);color:var(--note-ink);border:1px dashed var(--note-line);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.quiz .chip{color:var(--ink)}.qq{font-weight:600}.qfb.good{color:var(--ok);font-weight:600}.qfb.bad{color:var(--warn);font-weight:600}

/* Rapport */
.report{display:grid;gap:18px;padding-top:28px;max-width:960px}
.rep-h{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.score-big{display:grid;justify-items:end;line-height:1}.score-big b{font-family:var(--f-display);font-size:3.6rem;font-weight:800}
.score-big span{font-family:var(--f-mono);color:var(--muted)}.score-big small{font-weight:700;color:var(--accent);margin-top:4px}

function scrSVG(state){
  const X=82,Y=52,W=276,H=156,cx=X+W/2,cy=Y+H/2;

  const osd=(a,b)=>bg("#0b0e13")+`<rect x="${cx-78}" y="${cy-20}" width="156" height="40" rx="2" fill="#0f2240" stroke="#7aa6dc"/>
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="13" font-weight="600" fill="#f1f5fb" font-family="system-ui">${a}</text><text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="9" fill="#a8c4e6" font-family="system-ui">${b}</text>`;

    ${[0,1,2].map(i=>`<rect x="${X+12}" y="${Y+12+i*30}" width="18" height="18" rx="3" fill="#e9eef5" opacity=".85"/>`).join("")}
    <rect x="${X}" y="${Y+H-14}" width="${W}" height="14" fill="#141a24" opacity=".92"/>${[0,1,2,3,4].map(i=>`<rect x="${X+100+i*16}" y="${Y+H-11}" width="9" height="9" rx="2" fill="${i===0?"#7fb5ee":"#56606e"}"/>`).join("")}</g>`;
  const wnd=(title,rows,col)=>desk(1)+`<rect x="${X+30}" y="${Y+16}" width="${W-60}" height="${H-40}" rx="3" fill="#f6f7f9"/><rect x="${X+30}" y="${Y+16}" width="${W-60}" height="14" rx="3" fill="#dfe5ec"/>
    <text x="${X+38}" y="${Y+26}" font-size="8" fill="#273140" font-family="system-ui" font-weight="600">${title}</text>
    ${rows.map((r,i)=>`<text x="${X+40}" y="${Y+46+i*15}" font-size="${i===0?9:8.5}" fill="${r[1]||"#273140"}" font-family="system-ui" ${r[2]?'font-weight="700"':""}>${r[0]}</text>`).join("")}`;
  switch(state){

  case"off":return bg("#040506");
  case"dark":return bg("#050608");
  case"nosig":return osd("Geen signaal","DisplayPort · controleer de kabel");

  case"flicker":return `<g class="flick">${desk(1)}</g>`+[0,1,2,3,4,5].map(i=>`<rect x="${X}" y="${Y+i*27}" width="${W}" height="6" fill="#fff" opacity=".35"/>`).join("");
  case"dim":return bg("#030405")+desk(.09);
  case"faint":return bg("#040506")+desk(.17);
  case"menu":return bg("#0b0e13")+`<rect x="${cx-80}" y="${cy-48}" width="160" height="96" rx="3" fill="#0f2240" stroke="#7aa6dc"/>
    <text x="${cx-68}" y="${cy-30}" font-size="10" fill="#a8c4e6" font-family="system-ui" letter-spacing="1">INGANG</text>
    ${["HDMI 1","HDMI 2","DisplayPort"].map((t,i)=>`<rect x="${cx-72}" y="${cy-20+i*20}" width="144" height="17" rx="2" fill="${i===0?"#2d5a9b":"transparent"}"/><text x="${cx-64}" y="${cy-8+i*20}" font-size="11" fill="#f1f5fb" font-family="system-ui">${t}</text>`).join("")}`;
  case"menub":return bg("#030405")+desk(.09)+`<rect x="${cx-80}" y="${cy-28}" width="160" height="56" rx="3" fill="#0f2240" stroke="#7aa6dc"/>
    <text x="${cx-68}" y="${cy-10}" font-size="10" fill="#a8c4e6" font-family="system-ui" letter-spacing="1">HELDERHEID</text><rect x="${cx-68}" y="${cy+2}" width="136" height="6" rx="3" fill="#2a3b55"/><rect x="${cx-68}" y="${cy+2}" width="108" height="6" rx="3" fill="#7aa6dc"/>`;
  case"bios":return bg("#000")+`<rect x="${cx-46}" y="${cy-30}" width="92" height="40" rx="3" fill="none" stroke="#e8e8e8" stroke-width="2"/>
    <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="16" font-weight="700" fill="#e8e8e8" font-family="system-ui" letter-spacing="2">BIOS</text>
    <text x="${cx}" y="${Y+H-14}" text-anchor="middle" font-size="8" fill="#9a9a9a" font-family="monospace">DEL: setup    F12: opstartmenu</text>`;
  case"loading":return bg("#000")+`<g class="spin">${[0,1,2,3,4,5].map(i=>{const a=i*Math.PI/3;return `<circle cx="${cx+14*Math.cos(a)}" cy="${cy+14*Math.sin(a)}" r="${1.5+i*.35}" fill="#dfe6ee"/>`}).join("")}</g>`;
  case"login":return `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="url(#wall2)"/>`+bg("rgba(0,0,0,.35)")+`<circle cx="${cx}" cy="${cy-14}" r="16" fill="#dfe6ee"/><text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="11" fill="#fff" font-family="system-ui">Aanmelden…</text>`;
  case"white":return bg("#f4f6f8");

  case"lowres":return `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="url(#wall2)"/><text x="${cx}" y="${cy}" text-anchor="middle" font-size="16" fill="#fff" font-family="system-ui" opacity=".85">640 × 480</text>`;
  case"desktop":return desk(1);
  case"winp":return desk(.6)+`<rect x="${X+W-96}" y="${Y}" width="96" height="${H}" fill="#1c2430"/>${["Alleen pc-scherm","Dupliceren","Uitbreiden","Alleen tweede scherm"].map((t,i)=>`<rect x="${X+W-90}" y="${Y+10+i*32}" width="84" height="26" rx="2" fill="${i===0?"#2d5a9b":"#2a3442"}"/><text x="${X+W-84}" y="${Y+27+i*32}" font-size="8" fill="#e8eef6" font-family="system-ui">${t}</text>`).join("")}`;
  case"taskmgr":return bg("#020304")+`<rect x="${X+40}" y="${Y+24}" width="${W-80}" height="${H-48}" rx="3" fill="#f6f7f9"/><rect x="${X+40}" y="${Y+24}" width="${W-80}" height="14" fill="#dfe5ec"/>
    <text x="${X+48}" y="${Y+34}" font-size="8" font-weight="600" fill="#273140" font-family="system-ui">Taakbeheer · Nieuwe taak uitvoeren</text><rect x="${X+52}" y="${Y+56}" width="${W-104}" height="14" fill="#fff" stroke="#9aa6b4"/>
    <text x="${X+56}" y="${Y+66}" font-size="9" fill="#111" font-family="monospace">explorer.exe</text>`;
  case"energy":return wnd("Instellingen › Systeem › Energie",[["Scherm uitschakelen na",null,1],["1 minuut  →  15 minuten","#1d5cc0"],["Slaapstand na: 30 minuten"]]);
  case"devmgr-warn":return wnd("Apparaatbeheer",[["Beeldschermadapters",null,1],["⚠  NVIDIA GeForce (code 43)","#b86a0e",1],["Dit apparaat werkt niet goed."]]);
  case"devmgr-conflict":return wnd("Apparaatbeheer",[["Beeldschermadapters",null,1],["AMD Radeon RX","#273140"],["⚠  NVIDIA GeForce (oude driver)","#b86a0e",1]]);
  case"devmgr-ok":return wnd("Apparaatbeheer",[["Beeldschermadapters",null,1],["Grafische kaart  ·  werkt correct","#2a7d52"]]);
  case"temp-hot":return wnd("HWiNFO · sensoren",[["GPU-temperatuur",null,1],["98 °C  ▲ kritiek","#c0392b",1],["Ventilator GPU: 0 rpm"]]);
  case"temp-ok":return wnd("HWiNFO · sensoren",[["GPU-temperatuur",null,1],["68 °C  normaal","#2a7d52",1],["Ventilator GPU: 1450 rpm"]]);
  case"progress":return wnd("Bezig…",[["Driver wordt geïnstalleerd",null,1],["██████████░░░░  70 %","#1d5cc0"]]);
  }
  return bg("#000");
}

const PCOL={cav:"#1b2128",shell:"#9aa4ae",tongue:"#d3d9df",vga:"#2f63c4",vgaD:"#1c3d7a",dvi:"#f1efe8",dviD:"#7d7a70",pin:"#2a2a2a",usb3:"#2e6fd8",gold:"#c9a548"};
function shape(t){
  const PC=PCOL,Sx=`stroke="${PC.shell}" stroke-width="3"`;
  switch(t){
  case"hdmi":return `<polygon points="10,16 110,16 110,32 98,44 22,44 10,32" fill="${PC.cav}" ${Sx}/><rect x="24" y="24" width="72" height="8" fill="${PC.tongue}"/>`;
  case"dp":return `<polygon points="12,16 108,16 108,34 98,44 12,44" fill="${PC.cav}" ${Sx}/><rect x="22" y="24" width="72" height="8" fill="${PC.tongue}"/>`;
  case"usbc":return `<rect x="28" y="20" width="64" height="20" rx="10" fill="${PC.cav}" ${Sx}/><rect x="40" y="27" width="40" height="6" rx="2" fill="${PC.tongue}"/>`;
  case"usba":return `<rect x="24" y="17" width="72" height="26" fill="${PC.cav}" ${Sx}/><rect x="28" y="21" width="64" height="9" fill="${PC.usb3}"/>`;
  case"vga":{let p=`<circle cx="9" cy="30" r="5" fill="${PC.shell}"/><circle cx="111" cy="30" r="5" fill="${PC.shell}"/><polygon points="20,13 100,13 93,47 27,47" fill="${PC.vga}" stroke="${PC.vgaD}" stroke-width="3" stroke-linejoin="round"/>`;
    [[22,36,12],[30,39,10.5],[38,42,9]].forEach(([y,x0,dx])=>{for(let i=0;i<5;i++)p+=`<circle cx="${x0+i*dx}" cy="${y}" r="2.3" fill="${PC.vgaD}"/>`});return p;}
  case"dvid":case"dvii":{let p=`<polygon points="6,14 114,14 114,40 106,48 14,48 6,40" fill="${PC.dvi}" stroke="${PC.dviD}" stroke-width="2.5"/>`;
    for(let r=0;r<3;r++)for(let i=0;i<8;i++)p+=`<rect x="${14+i*8}" y="${21+r*8}" width="4" height="4" fill="${PC.pin}"/>`;
    p+=`<rect x="88" y="29" width="20" height="3" fill="${PC.pin}"/>`;
    if(t==="dvii")[[91,21],[103,21],[91,37],[103,37]].forEach(([x,y])=>p+=`<rect x="${x}" y="${y}" width="4" height="4" fill="${PC.pin}"/>`);return p;}
  case"rj45":{let p=`<polygon points="34,8 86,8 86,42 72,42 72,52 48,52 48,42 34,42" fill="${PC.cav}" ${Sx}/>`;for(let i=0;i<8;i++)p+=`<rect x="${39+i*5.5}" y="11" width="3" height="10" fill="${PC.gold}"/>`;return p;}
  case"aud":return `<circle cx="60" cy="30" r="16" fill="#4c9f50" stroke="#2f6b33" stroke-width="2"/><circle cx="60" cy="30" r="6" fill="${PC.cav}"/>`;
  case"audp":return `<circle cx="60" cy="30" r="16" fill="#e07aa6" stroke="#9c4a6e" stroke-width="2"/><circle cx="60" cy="30" r="6" fill="${PC.cav}"/>`;
  case"audb":return `<circle cx="60" cy="30" r="16" fill="#4f8fd6" stroke="#2c5c94" stroke-width="2"/><circle cx="60" cy="30" r="6" fill="${PC.cav}"/>`;
  case"c14":return `<polygon points="36,8 84,8 84,38 74,50 46,50 36,38" fill="${PC.cav}" ${Sx}/><rect x="45" y="22" width="5" height="12" fill="${PC.shell}"/><rect x="58" y="16" width="5" height="12" fill="${PC.shell}"/><rect x="70" y="22" width="5" height="12" fill="${PC.shell}"/>`;
  case"sw":return `<rect x="38" y="12" width="44" height="36" rx="3" fill="${PC.cav}" ${Sx}/><rect x="44" y="16" width="32" height="28" fill="#3a434d"/><text x="50" y="35" fill="#e6e6e6" font-size="14" font-family="monospace">I O</text>`;
  }
}

function newCase(){const open=CASES.filter(c=>!P.solved[c.id]&&(!TR||c.id!==TR.c.id));const pool=open.length?open:CASES.filter(c=>!TR||c.id!==TR.c.id);

function renderCase(){
  const c=TR.c,el=$("tgame");
  el.innerHTML=`<div class="game-top"><span>Opgelost <b>${Object.keys(P.solved).length}/${CASES.length}</b></span><span>Reeks <b>${P.streak}</b></span><span>Beste reeks <b>${P.bestStreak}</b></span></div>

   <div class="opts">${TR.order.map((o,i)=>`<button class="opt${o.picked?(o.ok?" right":" wrong"):""}" data-i="${i}" ${TR.fb||o.picked?"disabled":""}>${o.t}</button>`).join("")}</div>

  el.querySelectorAll(".opt:not(:disabled)").forEach(b=>b.onclick=()=>{const o=TR.order[+b.dataset.i];o.picked=true;TR.tries++;
    if(!o.ok){P.streak=0;save();if(TR.tries>=2){TR.order.forEach(x=>{if(x.ok)x.picked=true});TR.fb={ok:false,m:"Niet gevonden. Dit was de oorzaak:"}}else toast("Niet juist. Probeer nog eens (zonder punten).");renderCase();return}
    const first=TR.tries===1,again=P.solved[c.id];let pts=first?15-(TR.hint?5:0):0;if(again)pts=Math.round(pts/3);
    if(first){P.streak++;P.bestStreak=Math.max(P.bestStreak,P.streak)}P.solved[c.id]=1;

}

/* ================= RAPPORTCODES ================= */
function hash(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(36).toUpperCase().padStart(7,"0")}
function b64e(str){const b=new TextEncoder().encode(str);let s="";b.forEach(x=>s+=String.fromCharCode(x));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function b64d(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function makeCode(payload){const b=b64e(JSON.stringify(payload));return `SD1.${b}.${hash(SALT+b)}`}
function readCode(c){const m=/^SD1\.([A-Za-z0-9_-]+)\.([0-9A-Z]{7})$/.exec(c.trim());if(!m||hash(SALT+m[1])!==m[2])return null;try{const p=JSON.parse(b64d(m[1]));return p&&Array.isArray(p.r)?p:null}catch(e){return null}}
const ptsOf=(st,cs)=>Math.round(st*4+cs*1.6);

  ${P.codes.length?`<section><div class="sec-h"><h2>Mijn rapportcodes</h2></div><div class="codes">${P.codes.slice().reverse().map(c=>`<div class="codeline"><span>${esc(c.label)}</span><code>${c.code}</code><button class="btn sm2" data-copy="${c.code}">Kopieer</button></div>`).join("")}</div></section>`:""}
  ${isTeacher()?teacherHTML():`<section class="tlock"><details><summary>Voor de leerkracht</summary>

  $("pname").oninput=e=>{P.name=e.target.value.trim();save()};
  document.querySelectorAll(".dc button[data-m]").forEach(b=>b.onclick=()=>renderBrief(b.dataset.m));
  document.querySelectorAll("[data-train]").forEach(b=>b.onclick=()=>renderTrain(b.dataset.train));
  bindCopy($("app"));
  let arm=false;const w=$("wipe");w.onclick=()=>{if(!arm){arm=true;w.textContent="Zeker? Klik nogmaals";setTimeout(()=>{arm=false;w.textContent="Voortgang wissen"},3000);return}
    const keepT=P.teacher;P=fresh();P.teacher=keepT;save();renderHUD();renderHome()};
  if(isTeacher())bindTeacher();
  else{const go=()=>{const v=$("tcode").value.trim().toUpperCase();

    $("tgo").onclick=go;$("tcode").onkeydown=e=>{if(e.key==="Enter")go()}}
  window.scrollTo({top:0});

function bindCopy(root){root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const t=b.dataset.copy,ok=()=>{b.textContent="Gekopieerd";setTimeout(()=>b.textContent="Kopieer",1500)};
  const fb=()=>{const c=b.previousElementSibling;const r=document.createRange();r.selectNodeContents(c);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Ctrl+C om te kopiëren"};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(e){fb()}})}

/* ---------- leerkrachtpaneel ---------- */
function teacherHTML(){
  const byName={};TK.forEach(r=>{const k=(r.n||"(geen naam)").trim().toLowerCase();(byName[k]=byName[k]||{name:r.n||"(geen naam)",reps:[]}).reps.push(r)});
  const students=Object.values(byName).sort((a,b)=>a.name.localeCompare(b.name));
  const rowS=s=>{const best={},days=new Set();let exam=null,last=0;
    s.reps.forEach(r=>{r.r.forEach(([fi,st])=>{const id=FAULTS[fi]?.id;if(id)best[id]=Math.max(best[id]||0,st)});
      if(DAYS.find(d=>d.id===r.m))days.add(r.m);if(r.m==="examen")exam=Math.max(exam??0,r.s);last=Math.max(last,r.d)});
    const stars=Object.values(best).reduce((a,b)=>a+b,0);
    return `<tr><td><b>${esc(s.name)}</b></td><td>${DAYS.map(d=>`<span class="dd${days.has(d.id)?" on":""}" title="${d.day}">${d.day.slice(0,2)}</span>`).join("")}</td>
      <td>${Object.keys(best).length}/24</td><td>${stars}/72</td><td>${exam===null?"–":`<b class="${exam>=70?"okc":"badc"}">${exam}/100</b>`}</td><td>${s.reps.length}</td><td>${new Date(last).toLocaleDateString("nl-BE")}</td></tr>`};
  const agg={};TK.forEach(r=>r.r.forEach(([fi,st,cs,t,w,g])=>{const f=FAULTS[fi];if(!f)return;const a=agg[f.id]=agg[f.id]||{f,n:0,st:0,w:0,g:0,t:0};a.n++;a.st+=st;a.w+=w>0?1:0;a.g+=g?1:0;a.t+=t}));
  const fr=Object.values(agg).sort((a,b)=>a.st/a.n-b.st/b.n);
  return `<section class="teacher"><div class="sec-h"><h2>Klasoverzicht</h2><span class="pill">Leerkracht</span></div>
   <p class="muted">Cursisten krijgen na elke dag en na het examen een rapportcode. Plak hier de codes die je ontvangt, bijvoorbeeld uit je mailbox of Smartschool. Je mag er meerdere tegelijk plakken. Alles blijft in deze browser bewaard.</p>
   <div class="paste"><textarea id="tpaste" rows="3" placeholder="SD1.eyJ…  (één of meer codes)"></textarea><div class="wiz-actions"><button class="btn primary" id="tadd">Codes toevoegen</button><span id="tres" class="muted"></span></div></div>
   ${TK.length?`<h3 class="th3">Per cursist</h3><div class="tblwrap"><table><thead><tr><th>Cursist</th><th>Dagen</th><th>Storingen</th><th>Sterren</th><th>Beste examen</th><th>Rapporten</th><th>Laatst</th></tr></thead><tbody>${students.map(rowS).join("")}</tbody></table></div>
   <h3 class="th3">Per storing: waar loopt de klas vast?</h3><p class="muted">Gesorteerd van moeilijk naar makkelijk. Fouten = minstens één foute oplossing. Gokken = oorzaak gekozen zonder voldoende bewijs.</p>
   <div class="tblwrap"><table><thead><tr><th>Storing</th><th>Onderdeel</th><th>Pogingen</th><th>Gem. sterren</th><th>Fouten</th><th>Gokken</th><th>Gem. tijd</th></tr></thead>
   <tbody>${fr.map(a=>{const av=a.st/a.n;return `<tr class="${av<2?"hard":""}"><td>${a.f.d}</td><td><span class="cat c-${a.f.cat}">${CATS[a.f.cat]}</span></td><td>${a.n}</td><td><span class="bar"><i style="width:${av/3*100}%"></i></span> ${av.toFixed(1)}</td><td>${Math.round(a.w/a.n*100)}%</td><td>${Math.round(a.g/a.n*100)}%</td><td>${Math.round(a.t/a.n)} min <small>(norm ${a.f.par})</small></td></tr>`}).join("")}</tbody></table></div>`:`<p class="empty">Nog geen rapportcodes toegevoegd. Na het plakken verschijnt hier een overzicht per cursist en per storing.</p>`}
   <div class="wiz-actions tfoot"><span class="muted">Ontgrendelcode voor cursisten: <code>${UNLOCK_CODE}</code> · leerkrachtcode: <code>${TEACHER_CODE}</code></span>
     ${TK.length?`<button class="btn ghost" id="tclear">Klasoverzicht wissen</button>`:""}${P.teacher&&!OWNER?`<button class="btn ghost" id="toff">Leerkrachtmodus uit</button>`:""}</div></section>`;
}
function bindTeacher(){
  $("tadd").onclick=()=>{const raw=$("tpaste").value.match(/SD1\.[A-Za-z0-9_-]+\.[0-9A-Z]{7}/g)||[];let ok=0,dup=0,bad=0;
    const all=$("tpaste").value.match(/SD1[^\s]*/g)||[];bad=all.length-raw.length;
    raw.forEach(c=>{const p=readCode(c);if(!p){bad++;return}if(TK.some(r=>r.code===c)){dup++;return}TK.push(Object.assign(p,{code:c}));ok++});
    saveTK();renderHome();const m=$("tres");if(m)m.textContent=`${ok} toegevoegd${dup?` · ${dup} al aanwezig`:""}${bad?` · ${bad} ongeldig of gewijzigd`:""}`};
  const c=$("tclear");if(c){let arm=false;c.onclick=()=>{if(!arm){arm=true;c.textContent="Zeker? Klik nogmaals";setTimeout(()=>{arm=false;c.textContent="Klasoverzicht wissen"},3000);return}TK=[];saveTK();renderHome()}}
  const o=$("toff");if(o)o.onclick=()=>{P.teacher=false;save();renderHome()};
}

    note(`Kijk goed naar de foto: het lampje, het scherm en de kabels.${SH.help===1&&tot?` De foto sluit ${tot===1?"één oorzaak":tot+" oorzaken"} uit.`:""}`);

function coach(id,r,newly,before,fix){

function tip(){

    const c=T[t][3]+(T[t][4][0]==="o"&&!S.onsite?5:0);const sc=(gr-1)/c;if(gr>1&&sc>score){best=t;score=sc}});

  else if(!best)note("Niets maakt nog verschil. Kies de oorzaak die het best past bij wat je weet.");

  else note(`Tip: probeer <b>${S.onsite?lc(T[best][2]):"'"+T[best][0]+"'"}</b>. Dat maakt onderscheid tussen de oorzaken die nog mogelijk zijn.`);

async function diagnose(){
  if(!S.sel||S.busy||S.stage!=="work")return;
  if(SH.help===3&&!S.ev.size)return;
  const f=S.f,pk=FX(S.sel);S.busy=true;refresh();
  if(S.sel!==f.id){
    const was=SH.help===1&&!S.alive.has(S.sel);S.wrong++;if(SH.help===1){S.alive.delete(S.sel);S.elimBy[S.sel]="foute oplossing"}
    if(SH.help===2)S.struck.add(S.sel);
    logStep("wrong","Foute oplossing: "+lc(pk.d),10,0,"bad");S.sel=null;S.diagOpen=false;
    sys(`Je voert een oplossing uit voor: ${lc(pk.d)} · +10 min`);spend(10,700);await typing(1200);bubble("user","Ik heb nog altijd geen beeld hoor…");
    note(was?"Die oorzaak had je zelf al uitgesloten. Let goed op je lijst!":"Dat was fout. Bekijk je waarnemingen opnieuw: welke oorzaken passen daar echt bij?","warn");
    toast("Foute oplossing: +10 minuten");S.busy=false;refresh();armIdle();return;
  }
  if(SH.help===3){
    const tests=[...new Set([...S.ev].map(i=>S.log[i].id))];
    const cand=FAULTS.filter(x=>tests.every(t=>OBS[t](x).k===OBS[t](f).k));
    S.evOk=cand.length===1;S.evOther=cand.filter(x=>x.id!==f.id);S.gamble=!S.evOk;
  }else S.gamble=S.alive.size>1;
  S.diagOpen=false;
  if(!S.v.fixed){
    const fc=f.fix.length?Math.min(...f.fix.map(t=>T[t][3])):0;
    sys(`Oplossing uitgevoerd: ${lc(f.d)}${fc?` · +${fc} min`:""}`);if(fc){spend(fc,500);logStep("fixauto","Oplossing uitvoeren",fc,0,"fix")}
    fixIt();if(S.onsite)renderScene();await typing(900);bubble("user",f.diagOnly?"Oké, bedankt voor de uitleg.":"Ik heb weer beeld!");
  }
  if(S.gamble)note(SH.help===3?`Juist, maar je bewijs volstaat niet: met die waarnemingen kon het ook nog ${S.evOther.slice(0,3).map(x=>"'"+lc(x.d)+"'").join(", ")}${S.evOther.length>3?" of nog andere":""} zijn. Daarom één ster minder.`:
    `Juist, maar je gokte: er waren nog ${S.alive.size} oorzaken mogelijk. Daarom één ster minder. Een goede technieker bevestigt eerst.`,"warn");
  else if(SH.help===3)note("Juist, en je bewijs is sluitend. Zo werkt een echte technieker.","good");
  S.stage="closing";S.busy=false;refresh();
}
async function closeTicket(a){
  const f=S.f,nm=S.p[0];
  if(a==="c1")bubble("agent",`${f.sol} Laat gerust iets weten als het opnieuw gebeurt. Fijne dag!`);else if(a==="c2")bubble("agent","Opgelost. Ticket wordt gesloten.");

  if(a!=="c3"){await typing(1000);bubble("user",cs>=5?"Super, dank je wel voor de snelle hulp!":cs===4?"Bedankt, het werkt weer.":cs===3?"Oké. Het duurde wel even.":"Eindelijk… Ik heb mijn werk moeten uitstellen.")}
  else note("Je sluit het ticket zonder iets te zeggen. De gebruiker weet niet wat er mis was en of het opnieuw kan gebeuren.","warn");
  if(a==="c2")note("Leg de gebruiker kort uit wat er mis was. Zo voorkom je dat het opnieuw gebeurt.","warn");
  let st=starsFor(S.t);if(S.gamble)st=Math.max(1,st-1);
  const pts=ptsOf(st,cs);
  let xp=st*20+(cs>=4?10:0);if(P.best[f.id])xp=Math.round(xp/2);
  P.best[f.id]=Math.max(P.best[f.id]||0,st);if(cs===5)P.csat5++;if(!S.gamble)P.noGamble++;if(!S.onsite)P.chatFix++;save();
  SH.res[SH.idx]={f,st,cs,t:S.t,pts,steps:S.log.length,wrong:S.wrong,gamble:!!S.gamble,p:S.p};
  S.stage="done";clearTimeout(idleT);S.busy=false;
  sys(`Ticket #${S.no} gesloten · ${nm} gaf ${cs}/5`);
  const last=SH.idx===SH.list.length-1;
  const card=document.createElement("div");card.className="endcard";
  card.innerHTML=`<div class="end-top">${starHTML(st,"big")}<div><span class="eyebrow">Technische score</span><h3>${f.d}</h3></div></div>
    <dl class="stats"><div><dt>Tijd</dt><dd>${S.t} min</dd><small>3 ★ bij ${f.par} min of minder</small></div><div><dt>Tevredenheid</dt><dd>${cs}/5</dd><small>${"★".repeat(cs)}${"☆".repeat(5-cs)}</small></div>
    <div><dt>Stappen</dt><dd>${S.log.filter(e=>e.cost>0).length}</dd><small>${S.log.filter(e=>e.kind==="test"&&e.n===0).length} zonder resultaat</small></div><div><dt>Fouten</dt><dd>${S.wrong}</dd><small>${SH.help===3?(S.evOk?"bewijs sluitend":"bewijs onvolledig"):S.gamble?"gegokt":"niet gegokt"}</small></div></dl>
    ${SH.exam?"":debriefHTML(f)}${SH.exam?"":`<div class="quiz" id="squiz"></div>`}
    <div class="wiz-actions"><button class="btn primary" id="snext">${last?"Naar het dagrapport →":"Volgende melding →"}</button></div>`;
  add(card);const nx=$("snext");nx.onclick=()=>{if(nx.disabled)return;nx.disabled=true;if(last)renderReport();else{SH.idx++;newTicket()}};
  if(!SH.exam)renderQuiz(f);
  refresh();addXP(xp,"ticket afgehandeld");
}
function debriefHTML(f){
  const mine=S.log.filter(e=>e.cost>0||e.kind==="move");
  const cls=e=>e.kind==="bad"?"bad":e.kind==="fix"?"fix":e.kind==="move"?"move":e.kind==="info"?"info":e.n>0?"good":"none";
  const sub=e=>e.kind==="bad"?"fout":e.kind==="fix"?"oplossing":e.kind==="move"?(e.n?`rondkijken: −${e.n}`:"verplaatsing"):e.kind==="info"?"spoor":e.n>0?`−${e.n} oorzaken`:"niets nieuws";
  const ideal=f.rt.map(id=>id==="onsite"?["Ter plaatse",5]:[shortT(id),T[id][3]]);
  const it=ideal.reduce((a,x)=>a+x[1],0);
  const chipH=(l,c,k,s)=>`<li class="st ${k}"><b>${l}</b><small>${c} min${s?" · "+s:""}</small></li>`;
  return `<div class="debrief"><h4>Nabespreking</h4>
    <div class="route"><span class="rl">Jouw route · ${S.t} min</span><ol class="steps2">${mine.map(e=>chipH(e.label,e.cost,cls(e),sub(e))).join("")}</ol></div>
    <div class="route"><span class="rl">Aanbevolen route · ${it} min</span><ol class="steps2">${ideal.map(([l,c],i)=>chipH(l,c,"ideal",f.rt[i]==="onsite"?"verplaatsing":"")).join("")}</ol></div>
    <p class="why"><b>Waarom:</b> ${f.route}</p>
    ${SH.help===3&&!S.evOk?`<p class="why warnc"><b>Bewijs:</b> met jouw gekozen waarnemingen kon het ook nog ${S.evOther.slice(0,3).map(x=>lc(x.d)).join(", ")} zijn.</p>`:""}</div>`;
}
function renderQuiz(f){
  const el=$("squiz"),[q,ok,...wr]=f.q,opts=shuffle([ok,...wr]);
  el.innerHTML=`<div class="ni-h"><span class="ava">S</span><b>Kennisvraag van Sam</b> · +10 XP</div><p class="qq">${q}</p><div class="chips">${opts.map((o,i)=>`<button class="chip" data-i="${i}">${o}</button>`).join("")}</div>`;
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.i],good=o===ok;
    el.querySelectorAll(".chip").forEach(x=>{x.disabled=true;const v=opts[+x.dataset.i];if(v===ok)x.classList.add("right");else if(x===b)x.classList.add("wrong")});
    el.insertAdjacentHTML("beforeend",`<p class="qfb ${good?"good":"bad"}">${good?"Juist!":"Niet juist. Het juiste antwoord: "+ok+"."}</p>`);
    if(good){P.quiz++;save();addXP(10,"kennisvraag")}});
}

/* ================= RAPPORT ================= */
function renderReport(){
  VIEW="report";clearTimeout(idleT);
  const r=SH.res,stars=r.reduce((a,x)=>a+x.st,0),cs=(r.reduce((a,x)=>a+x.cs,0)/r.length).toFixed(1),tm=r.reduce((a,x)=>a+x.t,0),pts=r.reduce((a,x)=>a+x.pts,0);
  const score=Math.round(pts/(r.length*20)*100);
  if(DAYS.find(d=>d.id===SH.id)){P.days[SH.id]=true;const pf=r.every(x=>x.st===3);const prev=P.dayBest[SH.id]||{};P.dayBest[SH.id]={stars:Math.max(prev.stars||0,stars),perfect:prev.perfect||pf}}
  const now=new Date(),stamp=now.toLocaleDateString("nl-BE")+" "+now.toLocaleTimeString("nl-BE",{hour:"2-digit",minute:"2-digit"});
  if(SH.exam)P.exams.push({score,date:stamp});
  const code=makeCode({n:P.name||"",m:SH.id,h:SH.help,d:now.getTime(),s:score,r:r.map(x=>[FAULTS.indexOf(x.f),x.st,x.cs,x.t,x.wrong,x.gamble?1:0])});
  P.codes.push({label:`${SH.m.day} · ${stamp}${SH.exam?` · ${score}/100`:""}`,code});if(P.codes.length>30)P.codes=P.codes.slice(-30);
  save();checkBadges();renderHUD();
  const grade=score>=90?"Uitmuntend":score>=70?"Geslaagd":score>=50?"Bijna":"Nog oefenen";
  $("app").innerHTML=`<section class="report">
   <div class="rep-h"><div><span class="eyebrow">${SH.m.day} · ${SH.exam?"examenrapport":"dagrapport"}</span><h2>${SH.m.t}</h2>
     <p class="muted">${esc(P.name||"Naam niet ingevuld")} · ${stamp}</p></div>
     ${SH.exam?`<div class="score-big"><b>${score}</b><span>/100</span><small>${grade}</small></div>`:`<div class="score-big"><b>${stars}</b><span>/${r.length*3} ★</span><small>${grade}</small></div>`}</div>
   <dl class="stats wide"><div><dt>Tickets</dt><dd>${r.length}</dd></div><div><dt>Gem. tevredenheid</dt><dd>${cs}/5</dd></div><div><dt>Totale tijd</dt><dd>${tm} min</dd></div><div><dt>Fouten</dt><dd>${r.reduce((a,x)=>a+x.wrong,0)}</dd></div></dl>
   <div class="tblwrap"><table><thead><tr><th>Gebruiker</th><th>Oorzaak</th><th>Onderdeel</th><th>Tijd</th><th>Techniek</th><th>Tevredenheid</th>${SH.exam?"<th>Punten</th>":""}</tr></thead>
    <tbody>${r.map(x=>`<tr><td>${x.p[0]}</td><td>${x.f.d}</td><td><span class="cat c-${x.f.cat}">${CATS[x.f.cat]}</span></td><td>${x.t} min</td><td>${starHTML(x.st,"sm")}${x.gamble?` <small>${SH.help===3?"bewijs onvolledig":"gok"}</small>`:""}</td><td>${x.cs}/5</td>${SH.exam?`<td>${x.pts}/20</td>`:""}</tr>`).join("")}</tbody></table></div>
   <div class="codebox"><div><b>Jouw rapportcode</b><p class="muted">Kopieer deze code en bezorg ze aan je leerkracht, bijvoorbeeld via Smartschool of mail. Je vindt ze later ook terug onderaan de planning.</p></div>
     <div class="codeline"><code id="rcode">${code}</code><button class="btn sm2" data-copy="${code}">Kopieer</button></div></div>
   <div class="wiz-actions"><button class="btn" id="rhome">← Terug naar de planning</button><button class="btn primary" id="ragain">Opnieuw spelen</button></div></section>`;
  bindCopy($("app"));
  $("rhome").onclick=renderHome;$("ragain").onclick=()=>renderBrief(SH.id);
  window.scrollTo({top:0});
}
renderHUD();renderHome();
(async()=>{try{const u=await window.claude?.use?.("user");if(u&&await u.isOwner()){OWNER=true;if(VIEW==="home")renderHome()}}catch(e){}})();

$("brand").onclick=()=>{if(VIEW!=="shift")renderHome()};
</script>

</body></html>
